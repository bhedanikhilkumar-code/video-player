name: Package and release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing signed tenth-step tag, for example v30.7'
        required: true
        type: string
permissions:
  contents: write
  packages: write
concurrency:
  group: package-release-${{ inputs.tag }}
  queue: max
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate tag input before checkout
        env:
          VP_TAG: ${{ inputs.tag }}
        run: '[[ "$VP_TAG" =~ ^v[0-9]+\.[0-9]$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bhedanikhilkumar-code'
      - name: Verify signed source, stage release, publish package and compare registry download
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VP_TAG: ${{ inputs.tag }}
        run: bash scripts/publish-release.sh
