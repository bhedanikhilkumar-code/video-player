name: Package and release
on:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: package-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bhedanikhilkumar-code'
      - name: Build allowlisted static distribution
        run: |
          npm run build:package
          echo "VERSION=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_ENV"
      - name: Create archives and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VP_VERSION=$(node -p 'require("./package.json").version')
          test -n "$VP_VERSION"
          TAG="v$VP_VERSION"
          if gh release view "$TAG" >/tmp/existing-release 2>&1; then
            cat /tmp/existing-release
            echo 'This version already has a release. Bump the package version first.'
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/tmp/existing-tag 2>&1; then
            cat /tmp/existing-tag
            echo 'This version tag already exists. Bump the package version first.'
            exit 1
          fi
          (cd dist && zip -qr "video-player-$VP_VERSION.zip" video-player)
          npm pack ./dist/video-player --pack-destination dist
          (cd dist && sha256sum *.zip *.tgz > SHA256SUMS.txt)
          cat > dist/release-notes.md <<'NOTES'
          Static browser app distribution. Extract the zip and follow its README to serve the app locally or on a static host. The npm tarball contains the same app files.

          No backend, media files, native installer or credentials are bundled. Online playback needs internet; browser and downloader service restrictions still apply. See BUILD-INFO.json for the exact source commit and SHA256SUMS.txt for archive checksums.
          NOTES
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Video Player $VP_VERSION" --notes-file dist/release-notes.md dist/*.zip dist/*.tgz dist/SHA256SUMS.txt
      - name: Publish GitHub npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish ./dist/video-player --registry=https://npm.pkg.github.com
