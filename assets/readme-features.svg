<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="title">
<title id="title">Play, organise, fine-tune, personalise</title>
<defs><linearGradient id="g"><stop stop-color="#17223b"/><stop offset="1" stop-color="#212142"/></linearGradient></defs>
<rect width="1200" height="160" rx="18" fill="url(#g)"/>
<g font-family="Arial,sans-serif" font-weight="700"><g fill="#fbbf24"><text x="32" y="42" font-size="14">01 / PLAY</text></g><g fill="#2dd4bf"><text x="330" y="42" font-size="14">02 / ORGANISE</text></g><g fill="#a78bfa"><text x="628" y="42" font-size="14">03 / FINE-TUNE</text></g><g fill="#f9a8d4"><text x="926" y="42" font-size="14">04 / PERSONALISE</text></g>
<g fill="#ffffff" font-size="23"><text x="32" y="88">Press play.</text><text x="330" y="88">Build your library.</text><text x="628" y="88">Find your rhythm.</text><text x="926" y="88">Set the mood.</text></g>
<g fill="#acb9d3" font-size="15"><text x="32" y="122">Links + device media</text><text x="330" y="122">Queues + playlists</text><text x="628" y="122">Loops + local sound</text><text x="926" y="122">Themes + simple mode</text></g></g>
</svg>
